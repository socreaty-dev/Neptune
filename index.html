<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neptune — Techno DJ</title>
  <meta name="description" content="Driving grooves, moonlit sets and analog fury.">
  <link rel="stylesheet" href="css/01-variables.css">
  <link rel="stylesheet" href="css/02-base.css">
  <link rel="stylesheet" href="css/03-layout.css">
  <link rel="stylesheet" href="css/04-components.css">
  <link rel="stylesheet" href="css/05-utilities.css">
</head>
<body>
  <header class="header container">
    <nav class="nav">
      <div class="brand">NEPTUNE</div>
      <div>
        <button class="btn ghost small" onclick="toggleTheme()">Toggle</button>
      </div>
    </nav>
  </header>
  <main class="container main">
    <section class="hero">
      <div>
        <p class="kicker">Analog · Dark · Raw</p>
        <h1>Neptune — raw analog techno</h1>
        <p class="lead">Driving grooves, moonlit sets and analog fury.</p>
        <div class="mt-2">
          <a class="btn" href="#tour">Book now</a>
          <a class="btn ghost" href="#music">Listen</a>
        </div>
      </div>
    </section>
    <section id="gallery" class="gallery mt-2">
      <img src="media/sample1.jpg" alt="DJ Neptune live" loading="lazy">
      <img src="media/sample2.jpg" alt="Crowd" loading="lazy">
      <img src="media/sample3.jpg" alt="Lights" loading="lazy">
    </section>
  </main>
  <footer class="footer container">
    <div class="flex-between">
      <span>© Neptune 2026</span>
      <span>Built for the rave.</span>
    </div>
  </footer>
  <script src="js/theme-toggle.js"></script>
</body>
</html>
